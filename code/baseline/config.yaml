# Biohub Baseline Pipeline Configuration
# Faithful local recreation of Kaggle top notebook: cell-tracking-getting-started-w-nearest-neighbor.ipynb

data:
  database_dir: "database"
  test_dir: "database/test"
  train_dir: "database/train"
  validation_datasets:
    - "44b6_0113de3b"
    - "44b6_0b24845f"
    - "6bba_05b6850b"
    - "6bba_05db0fb1"

algorithm:
  downsample: 4
  filter_size: 3
  percentile: 90.0
  max_link_distance: 15.0  # µm
  scale: [1.625, 0.40625, 0.40625]  # Z, Y, X in µm/voxel

evaluation:
  match_distance: 7.0  # µm
  alpha: 0.1
  division_weight: 0.1

output:
  submission_path: "code/baseline/submission.csv"
  results_path: "code/baseline/BASELINE_RESULTS.md"
