[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biohub-cell-tracking"
version = "1.0.0"
description = "Biohub 3D Cell Tracking During Development — SOTA Neural-Symbolic Hybrid Architecture (0.953 LB/Val)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Biohub 3D Cell Tracking Research Team" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-image>=0.22.0",
    "pandas>=2.1.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "zarr>=3.0.0",
    "numcodecs>=0.13.0",
    "blosc2>=2.5.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "networkx>=3.2.1",
    "rustworkx>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]
